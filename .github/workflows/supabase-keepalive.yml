name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 08:00 UTC every 4 days to prevent Supabase Free Tier 7-day auto-pause
    - cron: '0 8 */4 * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health endpoint
        env:
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
        run: |
          if [ -z "$APP_HEALTH_URL" ]; then
            echo "APP_HEALTH_URL secret is not configured yet; skipping."
            exit 0
          fi
          curl -fsS --max-time 15 "$APP_HEALTH_URL"
